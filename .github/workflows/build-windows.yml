name: Build Windows and Linux

# Every push to main builds the Windows and Linux packages (download them from the run's "Artifacts").
# Publishing a GitHub Release, pushing a v* tag, or a push to main whose commit message starts with
# "release vX.Y.Z" builds them and attaches both to that release (created, with its tag, if needed).
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (mingw-w64 posix threads, CMake, Ninja)
        timeout-minutes: 25
        run: |
          # apt on the hosted runners sometimes stalls (man-db triggers, slow mirrors): skip man-db,
          # bound each attempt and retry
          sudo rm -f /var/lib/man-db/auto-update
          for i in 1 2 3; do
            timeout 300 sudo apt-get update -o Acquire::Retries=3 &&
            timeout 600 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mingw-w64 g++-mingw-w64-x86-64-posix cmake ninja-build zip && break
            echo "apt attempt $i failed, retrying"; sleep 15
          done
          command -v x86_64-w64-mingw32-g++-posix

      - name: SDL2 (mingw development package)
        run: |
          curl -sSL -o sdl.tgz https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-mingw.tar.gz
          tar xf sdl.tgz

      - name: Build
        working-directory: src
        run: |
          cmake -S . -B build-win -G Ninja -DCMAKE_TOOLCHAIN_FILE=mingw.cmake -DSDL2_DIR=$GITHUB_WORKSPACE/SDL2-2.30.9/x86_64-w64-mingw32
          ninja -C build-win -j3

      - name: Package
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          V=${GITHUB_REF_NAME}
          MSG=$(printf '%s' "$HEAD_MSG" | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then :
          elif [[ "$MSG" =~ ^release\ (v[0-9][0-9A-Za-z.-]*) ]]; then V=${BASH_REMATCH[1]}
          else V=dev-${GITHUB_SHA::7}; fi
          P=Gunslingers
          mkdir -p pkg/$P
          cp src/build-win/gunslingers.exe SDL2-2.30.9/x86_64-w64-mingw32/bin/SDL2.dll \
             /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll src/runtime/ipl-font-licenses.txt \
             dist/README.txt LICENSE THIRD_PARTY_NOTICES.md pkg/$P/
          sed -i "s/@VERSION@/$V/" pkg/$P/README.txt
          (cd pkg && zip -qr ../Gunslingers-$V-win64.zip $P)
          echo "ZIP=Gunslingers-$V-win64.zip" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: ${{ env.ZIP }}


  linux:
    runs-on: ubuntu-22.04   # older glibc: runs on SteamOS and most current distros
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (CMake, Ninja, SDL2, OpenGL)
        timeout-minutes: 25
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          for i in 1 2 3; do
            timeout 300 sudo apt-get update -o Acquire::Retries=3 &&
            timeout 600 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build g++ libsdl2-dev libgl-dev && break
            echo "apt attempt $i failed, retrying"; sleep 15
          done
          dpkg -s libsdl2-dev >/dev/null

      - name: Build
        working-directory: src
        run: |
          cmake -S . -B build-linux -G Ninja -DUSE_SDL=ON
          ninja -C build-linux -j3

      - name: Package
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          V=${GITHUB_REF_NAME}
          MSG=$(printf '%s' "$HEAD_MSG" | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then :
          elif [[ "$MSG" =~ ^release\ (v[0-9][0-9A-Za-z.-]*) ]]; then V=${BASH_REMATCH[1]}
          else V=dev-${GITHUB_SHA::7}; fi
          P=Gunslingers
          mkdir -p pkg/$P
          cp src/build-linux/gunslingers src/runtime/ipl-font-licenses.txt dist/README.txt LICENSE THIRD_PARTY_NOTICES.md pkg/$P/
          strip pkg/$P/gunslingers
          sed -i "s/@VERSION@/$V/" pkg/$P/README.txt
          tar -C pkg -czf Gunslingers-$V-linux-x64.tar.gz $P
          echo "TGZ=Gunslingers-$V-linux-x64.tar.gz" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TGZ }}
          path: ${{ env.TGZ }}

  release:
    needs: [build, linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || startsWith(github.event.head_commit.message, 'release v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Files and tag
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          ls -R out
          T=${GITHUB_REF_NAME}
          MSG=$(printf '%s' "$HEAD_MSG" | head -1)
          [[ "$MSG" =~ ^release\ (v[0-9][0-9A-Za-z.-]*) ]] && [[ "$GITHUB_REF" != refs/tags/* ]] && T=${BASH_REMATCH[1]}
          echo "TAG=$T" >> $GITHUB_ENV
          mkdir -p rel
          cp out/release-win/*.zip out/*linux-x64.tar.gz/*.tar.gz rel/
          ls -la rel
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: rel/*
          generate_release_notes: true
